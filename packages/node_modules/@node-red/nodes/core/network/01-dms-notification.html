<script type="text/javascript">
    RED.nodes.registerType('dms-notification-list',{
        category: 'common',
        color: '#a6bbcf',
        defaults: {
            name: {value:""},
            action: {value:"list"},
            baseUrl: {value:"http://101.35.85.65:8082"},
            token: {value:""},
            notificationId: {value:""},
            notificationName: {value:""},
            keyword: {value:""},
            pageNum: {value:"1"},
            limit: {value:"10"}
        },
        inputs:1,
        outputs:1,
        icon: "file.png",
        label: function() {
            if (this.name) return this.name;
            if (this.notificationName) return "通知人: " + this.notificationName;
            const actionLabels = {
                list: "通知人清單",
                add: "新增通知人",
                edit: "編輯通知人",
                delete: "刪除通知人"
            };
            return actionLabels[this.action] || "通知人管理";
        },
        oneditprepare: function() {
            const node = this;
            const notificationSelect = $('#node-input-notificationId');

            // Function to load notifications
            async function loadNotifications() {
                try {
                    // Get token from localStorage or config
                    const token = localStorage.getItem('token') || $('#node-input-token').val();

                    if (!token) {
                        notificationSelect.html('<option value="">Please set token first</option>');
                        return;
                    }

                    // Show loading state
                    notificationSelect.html('<option value="">Loading...</option>');

                    // Fetch notification list using DMSAPI
                    if (window.DMSAPI) {
                        const result = await window.DMSAPI.get(
                            '/schideron/openApi/config/notification/list',
                            { pageNum: '0', limit: '100' }
                        );

                        if (result.status === 'SUCCESS' && result.pageInfo && result.pageInfo.list) {
                            const notifications = result.pageInfo.list;
                            let options = '<option value="">-- Select Notification --</option>';

                            notifications.forEach(notification => {
                                const selected = notification.id === node.notificationId ? 'selected' : '';
                                options += `<option value="${notification.id}" ${selected}>${notification.name} (${notification.phone})</option>`;
                            });

                            notificationSelect.html(options);
                        } else {
                            notificationSelect.html('<option value="">No notifications found</option>');
                        }
                    } else {
                        notificationSelect.html('<option value="">DMSAPI not available</option>');
                    }
                } catch (error) {
                    console.error('Error loading notifications:', error);
                    notificationSelect.html('<option value="">Error: ' + error.message + '</option>');
                }
            }

            // Load notifications when dialog opens
            loadNotifications();

            // Reload when token changes
            $('#node-input-token').on('change', loadNotifications);

            // Update notificationName when selection changes
            notificationSelect.on('change', function() {
                const selectedOption = $(this).find('option:selected');
                const selectedText = selectedOption.text();
                if (selectedOption.val()) {
                    $('#node-input-notificationName').val(selectedText);
                } else {
                    $('#node-input-notificationName').val('');
                }
            });
        }
    });
</script>

<script type="text/html" data-template-name="dms-notification-list">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-action"><i class="fa fa-tasks"></i> Action</label>
        <select id="node-input-action" style="width:70%">
            <option value="list">取得列表 (List)</option>
            <option value="add">新增 (Add)</option>
            <option value="edit">編輯 (Edit)</option>
            <option value="delete">刪除 (Delete)</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-baseUrl"><i class="fa fa-globe"></i> Base URL</label>
        <input type="text" id="node-input-baseUrl" placeholder="http://101.35.85.65:8082">
    </div>
    <div class="form-row">
        <label for="node-input-token"><i class="fa fa-key"></i> Token</label>
        <input type="text" id="node-input-token" placeholder="Token (可從 msg.token 取得)">
    </div>
    <div class="form-row">
        <label for="node-input-notificationId"><i class="fa fa-user"></i> 選擇通知人</label>
        <select id="node-input-notificationId" style="width:70%">
            <option value="">Loading...</option>
        </select>
        <input type="hidden" id="node-input-notificationName">
    </div>
    <div class="form-row">
        <label for="node-input-keyword"><i class="fa fa-search"></i> Keyword</label>
        <input type="text" id="node-input-keyword" placeholder="搜尋關鍵字 (僅 list 使用)">
    </div>
    <div class="form-row">
        <label for="node-input-pageNum"><i class="fa fa-file"></i> Page Num</label>
        <input type="text" id="node-input-pageNum" placeholder="1 (僅 list 使用)">
    </div>
    <div class="form-row">
        <label for="node-input-limit"><i class="fa fa-list"></i> Limit</label>
        <input type="text" id="node-input-limit" placeholder="10 (僅 list 使用)">
    </div>
</script>

<script type="text/html" data-help-name="dms-notification-list">
    <p>取得 DMS 通知人清單</p>

    <h3>輸入</h3>
    <dl class="message-properties">
        <dt class="optional">baseUrl <span class="property-type">string</span></dt>
        <dd>DMS API 基礎 URL（選填，預設為配置值）</dd>

        <dt class="optional">token <span class="property-type">string</span></dt>
        <dd>認證 Token（選填，預設為配置值）</dd>

        <dt class="optional">keyword <span class="property-type">string</span></dt>
        <dd>搜尋關鍵字（選填）</dd>

        <dt class="optional">pageNum <span class="property-type">string</span></dt>
        <dd>頁碼（選填，預設為 "1"）</dd>

        <dt class="optional">limit <span class="property-type">string</span></dt>
        <dd>每頁筆數（選填，預設為 "10"）</dd>
    </dl>

    <h3>輸出</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>通知人列表資料，包含 total、pages、pageNum、pageSize、list 等欄位</dd>
    </dl>

    <h3>詳細資訊</h3>
    <p>此節點會呼叫 DMS API 取得通知人清單。</p>
    <p>Token 可以從配置中設定，或從 <code>msg.token</code> 動態傳入。</p>
    <p>回應格式：</p>
    <pre>{
  "total": 1,
  "pages": 1,
  "pageNum": 1,
  "pageSize": 10,
  "list": [
    {
      "id": "xxx",
      "name": "XXX人",
      "phone": "135xxx",
      "email": "xxx@aa.com",
      "description": "xxxtest"
    }
  ]
}</pre>
</script>
