<script type="text/javascript">
    RED.nodes.registerType('dms-protocol-list',{
        category: 'common',
        color: '#a6bbcf',
        defaults: {
            name: {value:""},
            action: {value:"list"},
            protocolId: {value:""},
            protocolName: {value:""}
        },
        inputs:1,
        outputs:1,
        icon: "file.png",
        label: function() {
            if (this.name) return this.name;
            if (this.protocolName) return "協定: " + this.protocolName;
            const actionLabels = {
                list: "通訊協定列表",
                add: "新增協定",
                edit: "編輯協定",
                delete: "刪除協定"
            };
            return actionLabels[this.action] || "通訊協定管理";
        },
        oneditprepare: function() {
            const node = this;
            const protocolSelect = $('#node-input-protocolId');

            // Function to load protocols
            async function loadProtocols() {
                try {
                    // Get token from localStorage or config
                    const token = localStorage.getItem('token') || $('#node-input-token').val();

                    if (!token) {
                        protocolSelect.html('<option value="">Please set token first</option>');
                        return;
                    }

                    // Show loading state
                    protocolSelect.html('<option value="">Loading...</option>');

                    // Fetch protocol list using DMSAPI
                    if (window.DMSAPI) {
                        const result = await window.DMSAPI.get(
                            '/schideron/openApi/protocol/list',
                            { pageNum: '0', limit: '100' }
                        );

                        if (result.status === 'SUCCESS' && result.pageInfo && result.pageInfo.list) {
                            const protocols = result.pageInfo.list;
                            let options = '<option value="">-- Select Protocol --</option>';

                            protocols.forEach(protocol => {
                                const selected = protocol.id === node.protocolId ? 'selected' : '';
                                options += `<option value="${protocol.id}" ${selected}>${protocol.name} (${protocol.type})</option>`;
                            });

                            protocolSelect.html(options);
                        } else {
                            protocolSelect.html('<option value="">No protocols found</option>');
                        }
                    } else {
                        protocolSelect.html('<option value="">DMSAPI not available</option>');
                    }
                } catch (error) {
                    console.error('Error loading protocols:', error);
                    protocolSelect.html('<option value="">Error: ' + error.message + '</option>');
                }
            }

            // Load protocols when dialog opens
            loadProtocols();

            // Update protocolName when selection changes
            protocolSelect.on('change', function() {
                const selectedOption = $(this).find('option:selected');
                const selectedText = selectedOption.text();
                if (selectedOption.val()) {
                    $('#node-input-protocolName').val(selectedText);
                } else {
                    $('#node-input-protocolName').val('');
                }
            });
        }
    });
</script>

<script type="text/html" data-template-name="dms-protocol-list">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-protocolId"><i class="fa fa-plug"></i> 選擇通訊協定</label>
        <select id="node-input-protocolId" style="width:70%">
            <option value="">Loading...</option>
        </select>
        <input type="hidden" id="node-input-protocolName">
    </div>
    <div class="form-row">
        <label for="node-input-action"><i class="fa fa-tasks"></i> Action</label>
        <select id="node-input-action" style="width:70%">
            <option value="list">取得列表 (List)</option>
            <option value="add">新增 (Add)</option>
            <option value="edit">編輯 (Edit)</option>
            <option value="delete">刪除 (Delete)</option>
        </select>
    </div>
</script>

<script type="text/html" data-help-name="dms-protocol-list">
    <p>DMS 通訊協定管理</p>

    <h3>Actions</h3>
    <ul>
        <li><b>list</b>: 取得通訊協定列表</li>
        <li><b>add</b>: 新增通訊協定</li>
        <li><b>edit</b>: 編輯通訊協定</li>
        <li><b>delete</b>: 刪除通訊協定</li>
    </ul>

    <h3>輸入 (msg 屬性)</h3>
    <dl class="message-properties">
        <dt class="optional">action <span class="property-type">string</span></dt>
        <dd>操作類型: list, add, edit, delete</dd>

        <dt class="optional">token <span class="property-type">string</span></dt>
        <dd>認證 Token</dd>

        <dt class="optional">id <span class="property-type">string</span></dt>
        <dd>協定 ID (edit/delete 必填)</dd>

        <dt class="optional">payload <span class="property-type">object</span></dt>
        <dd>對於 add/edit: {name, type, gatewayId, gatewayIp, ...}</dd>
    </dl>

    <h3>輸出</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>API 回應資料</dd>
    </dl>

    <h3>範例</h3>
    <p><b>新增協定:</b></p>
    <pre>msg.action = "add";
msg.payload = {
  name: "testMqtt",
  type: "MQTT",
  gatewayId: "xxx",
  gatewayIp: "192.168.1.1"
};</pre>
</script>
