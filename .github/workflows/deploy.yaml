name: Docker Image CI

on:
  push:
    branches: ['develop']
  workflow_dispatch:

concurrency:
  group: node-red-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: |
          DOCKER_BUILDKIT=1 docker build -t fms/node-red:latest .
      - name: Push the Docker image
        run: |
          cd /home/linuxuser/workspace/fms
          docker compose down node-red
          docker compose up -d node-red
