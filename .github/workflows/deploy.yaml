name: Docker Image CI

on:
  push:
    branches: ['develop', 'feat/*', 'fix/*']
  pull_request:
    branches: ['develop']

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: |
          DOCKER_BUILDKIT=1 docker build -t fms/node-red:latest .
      - name: Push the Docker image
        run: |
          cd /home/linuxuser/workspace/fms
          docker compose down node-red
          docker compose up -d node-red
