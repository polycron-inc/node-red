name: CI

on:
  push:
    branches: ['develop', 'feat/*', 'fix/*']
  pull_request:
    branches: ['develop']

concurrency:
  group: node-red-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  node-red-ci:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: 安裝依賴
        run: npm install --no-audit --no-fund
      - name: 測試
        run: npm test
